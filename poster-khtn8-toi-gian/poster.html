<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ứng dụng Khoa học tự nhiên trong đời sống – Kết nối tương lai</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{ --ink:#2b2f3a; --navy:#233a5c; --paper:#f5f0e4; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
/* Khổ A4 dọc: 1240 x 1754 px CSS (tỉ lệ 1 : 1,414) */
body{width:1240px;height:1754px;overflow:hidden;color:var(--ink);font-family:'M PLUS Rounded 1c','Nunito',sans-serif;font-weight:500;line-height:1.3}
.page{position:relative;width:1240px;height:1754px;padding:34px 38px 0;overflow:hidden;display:flex;flex-direction:column;background:var(--paper)}
/* hạt giấy rất nhẹ: màu mờ như in giấy, không bóng */
.page::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.2;z-index:10;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .26  0 0 0 .6 0'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>");}
.dec{position:absolute;border-radius:50%;z-index:0}
.page > *:not(.dec){position:relative;z-index:2}

/* ---------- đầu trang ---------- */
header{text-align:center;padding-top:6px}
h1{font:900 62px/1.05 'M PLUS Rounded 1c',sans-serif;color:var(--navy);letter-spacing:.01em}
.ribbon{position:relative;display:inline-block;width:900px;height:70px;margin-top:8px}
.ribbon svg{position:absolute;inset:0;width:100%;height:100%}
.ribbon span{position:relative;display:block;font:800 33px/70px 'M PLUS Rounded 1c',sans-serif;color:#3a2a14;letter-spacing:.02em;white-space:nowrap}
.tag{margin-top:10px;font:700 21px/1 'M PLUS Rounded 1c',sans-serif;color:#6b6252}

/* ---------- thẻ nội dung ---------- */
.row{display:grid;gap:22px;margin-top:22px}
.row.two{grid-template-columns:1fr 1fr}
.row.mid{grid-template-columns:1fr 150px 1fr}
.heartwrap{position:relative;z-index:5;display:flex;align-items:center;justify-content:center}
.heartwrap svg{position:absolute;width:236px;left:50%;top:50%;transform:translate(-50%,-50%)}
.card{background:var(--bg);border-radius:32px;padding:18px 24px 20px;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:14px}
.num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--c);color:#fff;font:900 28px/48px 'M PLUS Rounded 1c',sans-serif;text-align:center}
.hd h3{font:900 30px/1.1 'M PLUS Rounded 1c',sans-serif;color:var(--c)}
.ill{margin:10px -8px 8px}
.ill svg{display:block;width:100%;height:auto}
ul{list-style:none}
li{position:relative;padding-left:24px;margin:6px 0;font:700 20.5px/1.28 'M PLUS Rounded 1c',sans-serif;color:var(--ink)}
li::before{content:"";position:absolute;left:2px;top:.46em;width:11px;height:11px;border-radius:50%;background:var(--c)}

/* ---------- cuối trang ---------- */
.spacer{flex:1}
.pledge h2{text-align:center;font:900 27px/1 'M PLUS Rounded 1c',sans-serif;color:#8a5a14;letter-spacing:.03em;margin-bottom:12px}
.pl6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.pl{background:var(--bg);border-radius:22px;padding:12px 4px 12px;text-align:center}
.pl svg{display:block;width:50px;height:50px;margin:0 auto 6px}
.pl b{display:block;font:800 18px/1.1 'M PLUS Rounded 1c',sans-serif;color:var(--c)}
.credit{text-align:center;margin:16px 0 22px;font:500 9px/1.4 'M PLUS Rounded 1c',sans-serif;color:#8a8372;letter-spacing:.06em}
</style>
</head>
<body>
<!-- bộ lọc làm mép hình hơi “thủ công”, bớt cảm giác nhựa -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="page">
  <div class="dec" style="left:-130px;top:-120px;width:380px;height:380px;background:#dfead6"></div>
  <div class="dec" style="right:-110px;top:30px;width:300px;height:300px;background:#f6ded6"></div>
  <div class="dec" style="left:-90px;bottom:-130px;width:360px;height:360px;background:#f4e6c4;opacity:.7"></div>
  <div class="dec" style="right:-120px;bottom:-60px;width:340px;height:340px;background:#dce9f1;opacity:.8"></div>

  <header>
    <h1>ỨNG DỤNG KHOA HỌC TỰ NHIÊN</h1>
    <div class="ribbon">
      <svg viewBox="0 0 900 70" preserveAspectRatio="none"><path d="M0 6H900L872 35L900 64H0L28 35Z" fill="#edb94d"/></svg>
      <span>TRONG ĐỜI SỐNG – KẾT NỐI TƯƠNG LAI</span>
    </div>
    <p class="tag">Khoa học ở ngay quanh ta</p>
  </header>

  <main id="main"></main>
  <div class="spacer"></div>

  <section class="pledge">
    <h2>CHÚNG MÌNH CÙNG HÀNH ĐỘNG</h2>
    <div class="pl6" id="pl6"></div>
  </section>
  <div class="credit">Poster được thiết kế bởi Claude (Anthropic) · Làm thí nghiệm cùng người lớn</div>
</div>

<script src="art.js"></script>
<script>
const cards = [
  { n: 1, c: M.rose, bg: M.roseXL, title: 'Sức khỏe & dinh dưỡng', scene: scene1,
    items: ['Ăn đủ chất, uống đủ nước, ngủ đủ giấc', 'Rửa tay bằng xà phòng', 'Tiêm vắc-xin đúng lịch'] },
  { n: 2, c: M.musD, bg: M.musXL, title: 'Năng lượng & điện', scene: scene2,
    items: ['Tắt đèn, tắt thiết bị khi không dùng', 'Tay ướt không cắm điện', 'Ưu tiên điện mặt trời, điện gió'] },
  { n: 3, c: M.plum, bg: M.plumXL, title: 'Hóa học quanh ta', scene: scene3, mid: true,
    items: ['Chanh, giấm: acid nhẹ, tẩy cặn vôi', 'Baking soda: kiềm nhẹ, làm bánh nở', 'Bắp cải tím đổi màu theo acid – base'] },
  { n: 4, c: M.grn, bg: M.grnXL, title: 'Môi trường xanh', scene: scene4, mid: true,
    items: ['Phân loại rác: hữu cơ, tái chế, còn lại', 'Dùng túi vải, bình nước cá nhân', 'Đi xe đạp, trồng thêm cây xanh'] },
  { n: 5, c: M.blu, bg: M.bluXL, title: 'Công nghệ & kĩ thuật', scene: scene5,
    items: ['Đòn bẩy: kéo, bập bênh', 'Lực đẩy Archimedes giúp tàu nổi', 'Bình giữ nhiệt giữ nước nóng lâu'] },
  { n: 6, c: M.ter, bg: M.terXL, title: 'Kết nối tương lai', scene: scene6,
    items: ['Nghề cần khoa học: bác sĩ, kĩ sư, nhà hóa học, AI', 'Quan sát, đặt câu hỏi, thí nghiệm', 'Dùng công nghệ và AI có trách nhiệm'] }
];
const cardHTML = k => `
<article class="card" style="--c:${k.c};--bg:${k.bg}">
  <div class="hd"><div class="num">${k.n}</div><h3>${k.title}</h3></div>
  <div class="ill"><svg viewBox="0 -2 520 206" xmlns="http://www.w3.org/2000/svg" font-family="M PLUS Rounded 1c, sans-serif"><g filter="url(#rough)">${k.scene()}</g></svg></div>
  <ul>${k.items.map(t => `<li>${t}</li>`).join('')}</ul>
</article>`;
document.getElementById('main').innerHTML =
  `<div class="row two">${cardHTML(cards[0])}${cardHTML(cards[1])}</div>
   <div class="row mid">${cardHTML(cards[2])}<div class="heartwrap">${heartCenter()}</div>${cardHTML(cards[3])}</div>
   <div class="row two">${cardHTML(cards[4])}${cardHTML(cards[5])}</div>`;

const pledges = [['health', M.rose, M.roseXL, 'Sức khỏe'], ['energy', M.musD, M.musXL, 'Năng lượng'], ['chem', M.plum, M.plumXL, 'Hóa học'],
  ['eco', M.grn, M.grnXL, 'Môi trường'], ['tech', M.blu, M.bluXL, 'Kĩ thuật'], ['future', M.ter, M.terXL, 'Tương lai']];
document.getElementById('pl6').innerHTML = pledges.map(([i, c, bg, t]) =>
  `<div class="pl" style="--c:${c};--bg:${bg}">${pledgeIcons[i]}<b>${t}</b></div>`).join('');
</script>
</body>
</html>
